name: build-win-x64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（留空则自动：版本日期取今天，当天已发布过才自增末尾段）"
        required: false
  push:
    branches: [main]

env:
  VERSION: ${{ inputs.version || '' }}

# 同一时间只允许一个该工作流运行：新触发时自动取消在跑的那个，
# 避免并发构建互相覆盖产物 tag / 版本文件。
concurrency:
  group: build-win-x64
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Windows x64
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算发布版本号（自动自增）
        id: version
        shell: pwsh
        run: |
          $specified = "${{ env.VERSION }}"
          $today = Get-Date -Format 'yyyy.MM.dd'
          if ($specified -ne "") {
            $ver = $specified
          } else {
            $tags = (git tag --sort=-v:refname) 2>$null
            $last = ($tags | Select-Object -First 1)
            $ver = "$today.0001"
            # 版本日期跟随“今天”，不沿用最近 tag 的日期：跨天后从 .0001
            # 重新开始（修复 15 号构建还叫 …14.xxxx 的问题），当天已发布
            # 过才自增末尾段（…0001 → …0002）。
            if ($last -match '^(\d{4})\.(\d{2})\.(\d{2})\.(\d{4})$') {
              $lastDate = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
              if ($lastDate -eq $today) {
                $n = [int]$Matches[4] + 1
                $ver = "$today.$($n.ToString('0000'))"
              }
            }
          }
          Write-Host "发布版本号: $ver"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 写入版本号文件（构建前注入 exe）
        shell: pwsh
        run: |
          Set-Content -Path version.txt -Value "$env:VERSION" -NoNewline -Encoding ascii
          Write-Host "已写入 version.txt: $env:VERSION"

      - name: 安装 Rust 工具链 (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Cargo 依赖与构建产物
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-win-x64

      - name: 构建 Release
        run: cargo build --release

      - name: 代码签名 (signtool)
        if: env.CODE_SIGNING_CERT != '' && env.CODE_SIGNING_PASSWORD != ''
        shell: pwsh
        env:
          CODE_SIGNING_CERT: ${{ secrets.CODE_SIGNING_CERT }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: |
          try {
            $cert = "$env:RUNNER_TEMP\code-signing.pfx"
            [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:CODE_SIGNING_CERT))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "signtool 未找到" }
            & $signtool.FullName sign /fd SHA256 /f $cert /p $env:CODE_SIGNING_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 target/release/tui-project-manager.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign 失败 (exit $LASTEXITCODE)" }
            # 自签名证书无法通过受信任链校验，verify 必然报错，这里忽略其退出码，
            # 只打印校验输出用于排查，签名本身已成功应用。
            & $signtool.FullName verify /v target/release/tui-project-manager.exe 2>&1 | Out-Host
            Write-Host "::notice::代码签名完成（自签名证书，verify 报链不受信任属预期）"
          } catch {
            Write-Host "::warning::代码签名失败（不影响构建）: $($_.Exception.Message)"
          }
          exit 0

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tui-project-manager-win-x64-${{ env.VERSION }}
          path: target/release/tui-project-manager.exe
          if-no-files-found: error

      - name: 发布 pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: |
            Windows x64 自动构建（pre-release）

            - 版本: `${{ env.VERSION }}`
            - 运行: 直接运行 `tui-project-manager.exe`
            - 签名: 已配置代码签名证书则用 signtool 签名（SHA256 + RFC3161 时间戳）；未配置时跳过签名
            - 首页: 左侧项目列表点击选中 → 「启动 (内嵌页签)」在应用内终端页签运行；`＋ 添加` 添加项目（名称+路径），`重命名` / `改路径` / `删除` / `⚙ 设置`（可改 TUI 启动命令，如 nvim / lazygit / cmd）
            - 会话页签: 可多开，关闭按钮立即销毁会话；退出时记录打开中的页签目录，下次启动自动恢复
            - 终端交互: 右键有选区复制、无选区粘贴；Ctrl+C 有选区时复制、无选区发 SIGINT；Ctrl+V/多行粘贴（支持括号粘贴的应用按字面插入，shell 逐行执行）；滚轮查看滚动缓冲；左键拖拽选择文本
            - 界面: 顶栏可切换深/浅色主题、`🔄 检查更新` 手动检查新版本；启动与新开页签时自动检查一次，提示只显示在窗口底部状态栏，不弹窗
            - 刷新: 默认 30fps 基线刷新，设置中可调（15/30/60/120 FPS）
            - 配置: 自动保存到 exe 同级的 `config/config.json`
          files: target/release/tui-project-manager.exe
          draft: false
          prerelease: true
          update_release: true
