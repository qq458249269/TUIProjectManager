[package]
name = "tui-project-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26"
# 读剪贴板 CF_HDROP（资源管理器复制文件后的文件列表）；已是 arboard 的传递依赖，直接声明零新增编译。
clipboard-win = "5.4"
# 渲染后端：默认 wgpu（Windows 走 DX12），Intel 老 iGPU 的 OpenGL/Vulkan 驱动
# 会闪退（ig9icd64.dll / igvk64.dll），必须 DX12；AMD/NVIDIA 由 main.rs 启动时
# 自动选 glow（OpenGL，内存比 DX12 省 ~200MB），TPM_RENDERER=glow|wgpu 可强制。
# 不启 default_fonts（省 Ubuntu+NotoEmoji ~15MB）：基础字体用内嵌 HACK，见 setup_fonts。
eframe = { version = "0.36.1", default-features = false, features = ["glow", "wgpu"] }
fontdue = "0.9"
portable-pty = "0.9"
raw-window-handle = "0.6"
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
pollster = "1" # 已在 eframe 依赖树内，零新增编译：wgpu 30 enumerate_adapters 是 async，仅启动时 block_on 一次查显卡厂商
epaint_default_fonts = "0.36.1" # 内嵌 HACK 作为基础字体（替代 egui default_fonts，无 emoji，省 ~15MB）

[build-dependencies]
winres = "0.1"

# 开发迭代：自己代码轻优化，依赖全优化 → 编译快、运行不卡。
[profile.dev]
opt-level = 1
# 只留行号级别的调试信息：体积缩小约 5 倍，backtrace 仍可用
# （真实调完再开 debug = 2 用 gdb/lldb 看变量）。
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3

# 精简产物：全量链接 + 去符号。opt-level 用 2 而非 z：终端逐格渲染是热循环，
# z 的体积/对齐取舍实测明显慢于 2；lto+strip 已把体积差拉回可接受范围。
# 不用 panic=abort：页签崩溃隔离要靠 catch_unwind 捕获 UI 线程 panic，
# abort 模式下任何 panic 直接杀进程，无法做到“一个页签崩不影响整个软件”。
[profile.release]
opt-level = 2
codegen-units = 1
lto = true
strip = true

[patch.crates-io]
getrandom = { path = "vendor/getrandom-0.4.3" }

[dev-dependencies]
