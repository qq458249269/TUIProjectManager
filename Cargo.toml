[package]
name = "tui-project-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26"
# 读剪贴板 CF_HDROP（资源管理器复制文件后的文件列表）；已是 arboard 的传递依赖，直接声明零新增编译。
clipboard-win = "5.4"
# 关掉默认特性：去掉 wgpu/wayland/x11/accesskit/links，只用 glow 渲染器，
# 体积和链接依赖都大幅缩减（links 会拉入 webbrowser，后者在 gnu 工具链下缺 shlwapi）。
eframe = { version = "0.36.1", default-features = false, features = ["glow", "default_fonts"] }
portable-pty = "0.9"
raw-window-handle = "0.6"
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
winres = "0.1"

# 开发迭代：自己代码轻优化，依赖全优化 → 编译快、运行不卡。
[profile.dev]
opt-level = 1
# 只留行号级别的调试信息：体积缩小约 5 倍，backtrace 仍可用
# （真实调完再开 debug = 2 用 gdb/lldb 看变量）。
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3

# 精简产物：体积优先 + 全量链接 + 去符号。
# 不用 panic=abort：页签崩溃隔离要靠 catch_unwind 捕获 UI 线程 panic，
# abort 模式下任何 panic 直接杀进程，无法做到“一个页签崩不影响整个软件”。
[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
strip = true

[patch.crates-io]
getrandom = { path = "vendor/getrandom-0.4.3" }
